name: Release

on:
  workflow_run:
    workflows: ["Test the package"]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # No feature list: the crate has no optional functionality, and gpu-tests
    # only gates tests.
    uses: GregorLueg/personal-actions/.github/workflows/rust-release.yml@v1
    secrets: inherit
